# ~/.config/hypr/hypridle.conf
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Started from hyprland.lua's autostart. Timeouts are seconds of idle.

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid stacking lock screens
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # don't wake to a black screen
}

# 2.5 min — dim the backlight (no-op on desktops without one)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 5 min — lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min — screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 30 min — suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
