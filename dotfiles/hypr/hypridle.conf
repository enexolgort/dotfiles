# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh   # hyprlock, or swaylock in VirtualBox; won't stack
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'  # don't wake to a black screen
}
# `hyprctl dispatch` takes Lua (hl.dsp.*) with the Lua config.

# 2.5 min — dim the backlight (no-op on desktops without one)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 5 min — lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min — screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# 30 min — suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
