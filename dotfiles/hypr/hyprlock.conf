# ~/.config/hypr/hyprlock.conf — Catppuccin Mocha
# Docs:    https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Palette: https://catppuccin.com/palette (Mocha)
#
# Lock: Super+Tab (keybinds.lua), or automatically after 5 min idle
# (hypridle.conf). Clear the password: Esc, Ctrl+U, Ctrl+Backspace.
#
# In hyprlang `#` starts a comment, so colours inside pango markup are
# written `##rrggbb`.

# --- Catppuccin Mocha ----------------------------------------------------
$base     = rgb(1e1e2e)
$mantle   = rgb(181825)
$crust    = rgb(11111b)
$surface0 = rgb(313244)
$surface1 = rgb(45475a)
$overlay0 = rgb(6c7086)
$subtext0 = rgb(a6adc8)
$text     = rgb(cdd6f4)
$mauve    = rgb(cba6f7)
$lavender = rgb(b4befe)
$blue     = rgb(89b4fa)
$green    = rgb(a6e3a1)
$yellow   = rgb(f9e2af)
$peach    = rgb(fab387)
$red      = rgb(f38ba8)

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Blurred, darkened screenshot of the desktop; plain Mocha base if a
# screenshot can't be taken.
background {
    monitor =
    path = screenshot
    color = $base
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    contrast = 0.9
    vibrancy = 0.2
}

# --- Clock ------------------------------------------------------------------
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font ExtraBold
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $subtext0
    font_size = 18
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
}

# --- Password ---------------------------------------------------------------
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 3
    rounding = 15

    outer_color = $mauve $lavender 45deg
    inner_color = $surface0
    font_color = $text
    check_color = $peach                  # while PAM is checking
    fail_color = $red                     # wrong password
    capslock_color = $yellow              # Caps Lock on
    numlock_color = $blue
    bothlock_color = $yellow

    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">󰌾  <i>$USER</i></span>
    fail_text = <span foreground="##f38ba8">$PAMFAIL$FPRINTFAIL</span>

    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true

    position = 0, -20
    halign = center
    valign = center
}

# Blinking text cursor inside the field (hypr/scripts/password-cursor.sh)
label {
    monitor =
    text = cmd[update:500] ~/.config/hypr/scripts/password-cursor.sh
    color = $mauve
    font_size = 18
    font_family = $font
    position = 0, -18
    halign = center
    valign = center
}

# Keyboard layout — click to cycle layouts
label {
    monitor =
    text = <span foreground="##6c7086">󰌌  </span>$LAYOUT
    color = $subtext0
    font_size = 13
    font_family = $font
    onclick = hyprctl switchxkblayout all next
    position = 0, -90
    halign = center
    valign = center
}

# --- Now playing + media controls ------------------------------------------
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/now-playing.sh
    color = $lavender
    font_size = 15
    font_family = $font
    position = 0, -300
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰒮
    color = $overlay0
    font_size = 26
    font_family = $font
    onclick = playerctl previous
    position = -50, -365
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰐎
    color = $mauve
    font_size = 30
    font_family = $font
    onclick = playerctl play-pause
    position = 0, -365
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰒭
    color = $overlay0
    font_size = 26
    font_family = $font
    onclick = playerctl next
    position = 50, -365
    halign = center
    valign = center
}

# --- Bottom corner: host ------------------------------------------------------
label {
    monitor =
    text = cmd[update:0] echo "  $(hostname)"
    color = $overlay0
    font_size = 12
    font_family = $font
    position = -24, 20
    halign = right
    valign = bottom
}
