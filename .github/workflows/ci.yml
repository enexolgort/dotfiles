name: CI

on:
  push:
  pull_request:

jobs:
  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Not `nix flake check`: real hosts need hardware-configuration.nix,
      # which is a placeholder here. WSL hosts build fully and cover common/.
      - name: Check formatting
        run: |
          cd nixOS
          nix build .#checks.x86_64-linux.formatting --no-link

      - name: Build every WSL-type host (the ones CI can fully validate)
        run: |
          cd nixOS
          BUILT_ANY=false
          for hostDir in hosts/*/; do
            [ -d "$hostDir" ] || continue
            hostName="$(basename "$hostDir")"
            tt="$(nix --extra-experimental-features 'nix-command' eval --raw --file "hosts/$hostName/vars.nix" targetType 2>/dev/null || echo "")"
            if [ "$tt" = "wsl" ]; then
              echo "Building nixosConfigurations.$hostName (targetType=wsl)"
              nix build ".#nixosConfigurations.$hostName.config.system.build.toplevel" --no-link
              BUILT_ANY=true
            fi
          done
          if [ "$BUILT_ANY" = false ]; then
            echo "No host with targetType = \"wsl\" found under hosts/ — nothing for CI to build."
            exit 1
          fi

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck everything in scripts/
        run: shellcheck scripts/*.sh
